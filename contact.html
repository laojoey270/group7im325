<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Clone</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f9f9f9;
    }

    header {
      background: red;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .video-card img {
      width: 100%;
    }

    .video-card h4 {
      margin: 10px;
      font-size: 16px;
    }

    .player {
      display: none;
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 400px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>My YouTube Clone</header>

<div class="container" id="videoList"></div>

<div class="player" id="player">
  <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
  <br>
  <button onclick="goBack()">Back</button>
</div>

<script>
  const videos = [
    { title: "Sample Video 1", id: "dQw4w9WgXcQ" },
    { title: "Sample Video 2", id: "3JZ_D3ELwOQ" },
    { title: "Sample Video 3", id: "L_jWHffIx5E" }
  ];

  const videoList = document.getElementById("videoList");

  videos.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    card.innerHTML = `
      <img src="https://img.youtube.com/vi/${video.id}/0.jpg">
      <h4>${video.title}</h4>
    `;

    card.onclick = () => playVideo(video.id);
    videoList.appendChild(card);
  });

  function playVideo(id) {
    document.querySelector(".container").style.display = "none";
    document.getElementById("player").style.display = "block";
    document.getElementById("videoFrame").src =
      "https://www.youtube.com/embed/" + id;
  }

  function goBack() {
    document.querySelector(".container").style.display = "grid";
    document.getElementById("player").style.display = "none";
    document.getElementById("videoFrame").src = "";
  }
</script>

</body>
</html>
